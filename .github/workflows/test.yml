# PR checks: every pull request to main must pass the test suite before
# merge. (Deploys run tests too, but post-merge — this makes a red PR
# visible while it can still be fixed.) Actions are pinned to commit SHAs
# so a compromised tag can't inject code into CI.
name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install pandoc
        run: |
          PANDOC_VERSION=$(node -p "require('./package.json').config.pandoc_version")
          PANDOC_SHA256=$(node -p "require('./package.json').config.pandoc_deb_sha256")
          wget -q "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  pandoc-${PANDOC_VERSION}-1-amd64.deb" | sha256sum --check
          sudo dpkg -i "pandoc-${PANDOC_VERSION}-1-amd64.deb"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: ./build.sh --prod

      - name: Playwright smoke test
        run: npm run test:e2e
