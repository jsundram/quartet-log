# PR checks: every pull request to main must pass the test suite before
# merge. (Deploys run tests too, but post-merge — this makes a red PR
# visible while it can still be fixed.) Actions are pinned to commit SHAs
# so a compromised tag can't inject code into CI.
name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The audits are Python and node:test cannot see them; this is where
      # every bug in the alias/ensemble tooling has surfaced, so it gates too.
      # No new action to pin: the uv-or-venv fallback lives in the script.
      #
      # ubuntu-latest ships no uv, so the venv path runs and pip fetches the
      # pinned pytest. This cache helps re-runs WITHIN a PR only: Actions
      # scopes a cache to the ref that wrote it, and nothing here populates
      # one on main, so a new PR always starts cold and does hit PyPI. Kept
      # for the re-run case, not relied on — see #21, which removes the Python
      # toolchain and this step with it.
      - name: Cache pip downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-pytest-${{ hashFiles('scripts/run_audit_tests.sh') }}
          restore-keys: pip-pytest-

      - name: Run audit tests
        run: npm run test:audits

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install pandoc
        run: |
          PANDOC_VERSION=$(node -p "require('./package.json').config.pandoc_version")
          PANDOC_SHA256=$(node -p "require('./package.json').config.pandoc_deb_sha256")
          wget -q "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  pandoc-${PANDOC_VERSION}-1-amd64.deb" | sha256sum --check
          sudo dpkg -i "pandoc-${PANDOC_VERSION}-1-amd64.deb"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: ./build.sh --prod

      - name: Playwright smoke test
        run: npm run test:e2e
