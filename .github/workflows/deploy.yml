# Deploy to GitHub Pages on every push to main. Actions are pinned to
# commit SHAs so a compromised tag can't inject code into CI; the pandoc
# .deb is checksum-verified; Node comes from .nvmrc and esbuild from
# package-lock.json so local and CI builds use the same toolchain.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install pandoc
        # Version + checksum live in package.json (single source; build.sh
        # and README point there too).
        run: |
          PANDOC_VERSION=$(node -p "require('./package.json').config.pandoc_version")
          PANDOC_SHA256=$(node -p "require('./package.json').config.pandoc_deb_sha256")
          wget -q "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  pandoc-${PANDOC_VERSION}-1-amd64.deb" | sha256sum --check
          sudo dpkg -i "pandoc-${PANDOC_VERSION}-1-amd64.deb"

      # src/aliases.js (real player-name tables) is gitignored personal
      # data; the secret holds the file's full contents. Without it the
      # build falls back to the empty stub via scripts/ensure_aliases.mjs
      # and the deployed site shows the sheet's raw short names.
      - name: Materialize player aliases from secret
        env:
          PLAYER_ALIASES_JS: ${{ secrets.PLAYER_ALIASES_JS }}
        run: |
          if [ -n "$PLAYER_ALIASES_JS" ]; then
            printf '%s' "$PLAYER_ALIASES_JS" > src/aliases.js
            echo "src/aliases.js materialized from PLAYER_ALIASES_JS secret."
          else
            echo "::warning::PLAYER_ALIASES_JS secret is not set — building with the empty alias stub; the deployed site will show un-normalized short names."
          fi

      - name: Build
        run: ./build.sh --prod

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./last_deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
